# 主配置文件
defaults:
  - dataset: cwru
  - model: lpvg_mlp
  - method: openmax
  - _self_

# 实验名称
experiment_name: lpvg_osr

# 随机种子
seed: 42

# 设备
device: cuda  # cuda or cpu

# 训练参数
training:
  num_epochs: 100
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adam  # adam, sgd
  scheduler: step  # step, cosine, none
  step_size: 30
  gamma: 0.1

# LPVG 图构建参数
lpvg:
  m: 1                    # 穿透参数
  num_workers: 4          # 并行构建图的进程数
  cache_graphs: true      # 是否缓存构建好的图
  cache_dir: .cache/lpvg

# 图特征提取
graph_features:
  use_topology: true      # 拓扑特征（度、密度、聚类系数等）
  use_spectral: false     # 谱特征（拉普拉斯特征值）
  use_motifs: false       # 子图模式特征
  feature_dim: 64         # 特征维度

# 开放集识别参数
open_set:
  threshold_percentile: 95  # 阈值百分位
  distance_metric: euclidean  # euclidean, cosine, mahalanobis
  
# 评估参数
evaluation:
  eval_frequency: 5       # 每隔多少 epoch 评估一次
  save_best: true         # 保存最佳模型
  metrics:
    - accuracy            # 闭集准确率
    - auroc               # AUROC
    - oscr                # Open Set Classification Rate
    - f1_score            # F1 分数
    
# 日志
logging:
  log_dir: outputs/logs
  use_tensorboard: true
  print_frequency: 10
  
# 输出
output:
  checkpoint_dir: outputs/checkpoints
  visualization_dir: outputs/visualizations
  result_dir: outputs/results

# 数据加载
dataloader:
  num_workers: 0          # Windows 建议设为 0
  pin_memory: true
  shuffle: true
